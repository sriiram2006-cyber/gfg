<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GfG Campus Club - Resources</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gfg: { DEFAULT: '#2F8D46', light: '#4ade80' }, dark: { DEFAULT: '#0f172a', card: '#1e293b' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased min-h-screen flex flex-col">

    <!-- Navigation Bar -->
    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-3 cursor-pointer">
                    <img src="https://media.geeksforgeeks.org/gfg-gg-logo.svg" alt="GfG Logo" class="w-10 h-10 rounded">
                    <span class="font-bold text-xl tracking-tight text-white">GeeksforGeeks <span class="text-gfg">RIT</span></span>
                </a>
                
                <!-- Desktop Menu -->
                <div class="hidden md:flex items-center space-x-8">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Home</a>
                    <a href="events.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Events</a>
                    <a href="challenges.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Challenges</a>
                    <a href="resources.html" class="text-gfg-light font-bold text-sm">Resources</a>
                    <a href="leaderboard.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Leaderboard</a>
                    <button class="bg-gfg hover:bg-gfg-dark text-white px-6 py-2.5 rounded-full font-semibold transition-all shadow-lg shadow-gfg/30 text-sm">Join Community</button>
                </div>

                <!-- Mobile menu button -->
                <div class="flex md:hidden items-center">
                    <button id="mobile-menu-btn" class="text-white hover:text-gfg-light focus:outline-none">
                        <i class="fa-solid fa-bars text-2xl"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Mobile Menu Panel -->
        <div id="mobile-menu" class="md:hidden hidden bg-[#0f172a] border-b border-white/5">
            <div class="px-2 pt-2 pb-5 space-y-1 sm:px-3 flex flex-col items-center">
                <a href="index.html" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-white/5 hover:text-gfg-light">Home</a>
                <a href="events.html" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-white/5 hover:text-gfg-light">Events</a>
                <a href="challenges.html" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-white/5 hover:text-gfg-light">Challenges</a>
                <a href="resources.html" class="block px-3 py-2 rounded-md text-base font-bold text-gfg-light hover:bg-white/5">Resources</a>
                <a href="leaderboard.html" class="block px-3 py-2 rounded-md text-base font-medium text-white hover:bg-white/5 hover:text-gfg-light">Leaderboard</a>
                <button class="mt-4 w-11/12 bg-gfg hover:bg-gfg-dark text-white px-6 py-3 rounded-xl font-bold transition-colors shadow-lg shadow-gfg/20">
                    Join Community
                </button>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-24 px-4 max-w-7xl mx-auto w-full">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Learning <span class="text-gfg">Resources</span></h1>
            <div class="h-1 w-20 bg-gfg mx-auto rounded mb-6"></div>
            <p class="text-gray-400 max-w-2xl mx-auto text-lg">Curated materials, practice questions, and roadmaps to guide you from beginner to interview-ready.</p>
        </div>
        
        <!-- Category Filter Buttons -->
        <div class="flex flex-wrap justify-center gap-3 mb-12" id="resource-filters">
            <button onclick="filterResources('')" class="resource-filter-btn active bg-gfg/20 text-gfg-light px-5 py-2 rounded-full text-sm font-bold border border-gfg/30 hover:bg-gfg/30 transition-all">All</button>
            <button onclick="filterResources('Beginner')" class="resource-filter-btn bg-white/5 text-gray-300 px-5 py-2 rounded-full text-sm font-bold border border-white/10 hover:bg-blue-500/20 hover:text-blue-400 hover:border-blue-400/30 transition-all">
                <i class="fa-solid fa-code mr-1"></i> Beginner
            </button>
            <button onclick="filterResources('DSA')" class="resource-filter-btn bg-white/5 text-gray-300 px-5 py-2 rounded-full text-sm font-bold border border-white/10 hover:bg-gfg/20 hover:text-gfg-light hover:border-gfg/30 transition-all">
                <i class="fa-solid fa-layer-group mr-1"></i> DSA
            </button>
            <button onclick="filterResources('Interview')" class="resource-filter-btn bg-white/5 text-gray-300 px-5 py-2 rounded-full text-sm font-bold border border-white/10 hover:bg-purple-500/20 hover:text-purple-400 hover:border-purple-400/30 transition-all">
                <i class="fa-solid fa-briefcase mr-1"></i> Interview
            </button>
        </div>

        <!-- Loading State -->
        <div id="resources-loading" class="hidden text-center py-16">
            <i class="fa-solid fa-spinner fa-spin text-gfg text-3xl mb-4"></i>
            <p class="text-gray-400">Loading resources...</p>
        </div>

        <!-- Dynamic Resources Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8" id="resources-container">
            <!-- Will be populated dynamically by script.js -->
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
