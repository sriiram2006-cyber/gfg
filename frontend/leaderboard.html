<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GfG Campus Club - Leaderboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gfg: { DEFAULT: '#2F8D46', light: '#4ade80' }, dark: { DEFAULT: '#0f172a', card: '#1e293b' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="antialiased min-h-screen flex flex-col">

    <nav class="fixed w-full z-50 glass-nav transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-20">
                <a href="index.html" class="flex-shrink-0 flex items-center gap-3 cursor-pointer">
                    <img src="https://media.geeksforgeeks.org/gfg-gg-logo.svg" alt="GfG Logo" class="w-10 h-10 rounded">
                    <span class="font-bold text-xl tracking-tight">GeeksforGeeks <span class="text-gfg">RIT</span></span>
                </a>
                <div class="hidden lg:flex items-center flex-1 justify-evenly ml-8 lg:ml-12 pr-4">
                    <a href="index.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Home</a>
                    <a href="about.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">About</a>
                    <a href="events.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Events</a>
                    <a href="resources.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Resources</a>
                    <a href="leaderboard.html" class="text-gfg-light font-bold text-sm">Leaderboard</a>
                    <a href="roadmap.html" class="text-gray-300 hover:text-white hover:text-gfg-light transition-colors font-medium text-sm flex items-center gap-2"><i class="fa-solid fa-robot"></i> Roadmap</a>
                    <a href="contact.html" class="text-gray-300 hover:text-white transition-colors font-medium text-sm">Contact</a>
                    <button class="bg-gfg text-white px-6 py-2.5 rounded-full font-semibold shadow-lg shadow-gfg/30 text-sm">Join</button>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-24 px-4 max-w-5xl mx-auto w-full">
        <div class="text-center mb-16">
            <h1 class="text-4xl md:text-5xl font-bold mb-4">Campus <span class="text-gfg">Leaderboard</span></h1>
            <div class="h-1 w-20 bg-gfg mx-auto rounded mb-6"></div>
            <p class="text-gray-400 max-w-2xl mx-auto text-lg">Top coders recognized for their consistent problem-solving and contest participation (Live Database).</p>
        </div>

        <div class="glass-card rounded-2xl overflow-hidden shadow-2xl">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-white/5 text-gray-300 uppercase text-sm tracking-wider">
                            <th class="p-4 border-b border-white/10 text-center w-20">Rank</th>
                            <th class="p-4 border-b border-white/10">Student</th>
                            <th class="p-4 border-b border-white/10 text-right w-32">Points</th>
                            <th class="p-4 border-b border-white/10 text-center w-32">Badge</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Populated by script.js using fetch() -->
                        <tr>
                            <td colspan="4" class="text-center p-8 text-gray-500">
                                <i class="fa-solid fa-spinner fa-spin text-2xl mb-2"></i>
                                <p>Loading live rankings...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
