<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GfG RIT Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gfg: { DEFAULT: '#2F8D46', light: '#4ade80', dark: '#166534' }, dark: { DEFAULT: '#0f172a', card: '#1e293b' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="antialiased min-h-screen bg-[#0a0f1a] text-gray-200">

    <!-- Top Bar -->
    <nav class="bg-[#111827] border-b border-white/5 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-3">
            <img src="https://media.geeksforgeeks.org/gfg-gg-logo.svg" alt="GfG" class="w-8 h-8 rounded">
            <span class="font-bold text-lg text-white">Admin <span class="text-gfg">Dashboard</span></span>
        </div>
        <div class="flex items-center gap-4">
            <a href="/index.html" target="_blank" class="text-gray-400 hover:text-white text-sm transition-colors">
                <i class="fa-solid fa-external-link mr-1"></i> View Site
            </a>
            <button onclick="logout()" class="text-red-400 hover:text-red-300 text-sm font-bold transition-colors">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Logout
            </button>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-6 py-8">

        <!-- Stats Cards -->
        <div class="grid grid-cols-2 md:grid-cols-5 gap-4 mb-10" id="stats-grid">
            <div class="stat-card bg-[#111827] border border-white/5 rounded-xl p-5 text-center">
                <i class="fa-solid fa-calendar-days text-2xl text-blue-400 mb-2"></i>
                <div class="text-2xl font-bold text-white" id="stat-events">-</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Events</div>
            </div>
            <div class="stat-card bg-[#111827] border border-white/5 rounded-xl p-5 text-center">
                <i class="fa-solid fa-book text-2xl text-gfg mb-2"></i>
                <div class="text-2xl font-bold text-white" id="stat-resources">-</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Resources</div>
            </div>
            <div class="stat-card bg-[#111827] border border-white/5 rounded-xl p-5 text-center">
                <i class="fa-solid fa-users text-2xl text-purple-400 mb-2"></i>
                <div class="text-2xl font-bold text-white" id="stat-members">-</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Members</div>
            </div>
            <div class="stat-card bg-[#111827] border border-white/5 rounded-xl p-5 text-center">
                <i class="fa-solid fa-envelope text-2xl text-yellow-400 mb-2"></i>
                <div class="text-2xl font-bold text-white" id="stat-messages">-</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Messages</div>
            </div>
            <div class="stat-card bg-[#111827] border border-white/5 rounded-xl p-5 text-center">
                <i class="fa-solid fa-ticket text-2xl text-pink-400 mb-2"></i>
                <div class="text-2xl font-bold text-white" id="stat-registrations">-</div>
                <div class="text-xs text-gray-500 uppercase tracking-wider">Registrations</div>
            </div>
        </div>

        <!-- Tab Navigation -->
        <div class="flex gap-2 mb-6 border-b border-white/5 pb-4 flex-wrap">
            <button onclick="switchTab('events')" class="admin-tab active px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fa-solid fa-calendar-days mr-1"></i> Events
            </button>
            <button onclick="switchTab('resources')" class="admin-tab px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fa-solid fa-book mr-1"></i> Resources
            </button>
            <button onclick="switchTab('members')" class="admin-tab px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fa-solid fa-users mr-1"></i> Members
            </button>
            <button onclick="switchTab('messages')" class="admin-tab px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fa-solid fa-envelope mr-1"></i> Messages
            </button>
            <button onclick="switchTab('registrations')" class="admin-tab px-4 py-2 rounded-lg text-sm font-bold transition-all">
                <i class="fa-solid fa-ticket mr-1"></i> Registrations
            </button>
        </div>

        <!-- Tab Content -->

        <!-- EVENTS TAB -->
        <div id="tab-events" class="tab-content">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Manage Events</h2>
                <button onclick="toggleAddEvent()" class="bg-gfg hover:bg-gfg-dark text-white px-4 py-2 rounded-lg text-sm font-bold transition-all">
                    <i class="fa-solid fa-plus mr-1"></i> Add Event
                </button>
            </div>
            <!-- Add Event Form (hidden by default) -->
            <div id="add-event-form" class="hidden bg-[#111827] border border-white/5 rounded-xl p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" id="evt-title" placeholder="Event Title" class="admin-input">
                    <input type="text" id="evt-id" placeholder="Event ID (e.g. HACK2026)" class="admin-input">
                    <input type="date" id="evt-date" class="admin-input">
                    <input type="text" id="evt-desc" placeholder="Description" class="admin-input">
                </div>
                <button onclick="addEvent()" class="bg-gfg text-white px-6 py-2 rounded-lg text-sm font-bold">Save Event</button>
            </div>
            <div id="events-list" class="space-y-3"></div>
        </div>

        <!-- RESOURCES TAB -->
        <div id="tab-resources" class="tab-content hidden">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold text-white">Manage Resources</h2>
                <button onclick="toggleAddResource()" class="bg-gfg hover:bg-gfg-dark text-white px-4 py-2 rounded-lg text-sm font-bold transition-all">
                    <i class="fa-solid fa-plus mr-1"></i> Add Resource
                </button>
            </div>
            <div id="add-resource-form" class="hidden bg-[#111827] border border-white/5 rounded-xl p-6 mb-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                    <input type="text" id="res-title" placeholder="Resource Title" class="admin-input">
                    <select id="res-category" class="admin-input">
                        <option value="Beginner Programming">Beginner Programming</option>
                        <option value="DSA Preparation">DSA Preparation</option>
                        <option value="Interview Prep">Interview Prep</option>
                    </select>
                    <input type="url" id="res-link" placeholder="https://..." class="admin-input">
                    <select id="res-level" class="admin-input"><option value="Beginner">Beginner</option><option value="Intermediate">Intermediate</option><option value="Advanced">Advanced</option></select>
                    <input type="text" id="res-desc" placeholder="Short description" class="admin-input md:col-span-2">
                </div>
                <button onclick="addResource()" class="bg-gfg text-white px-6 py-2 rounded-lg text-sm font-bold">Save Resource</button>
            </div>
            <div id="resources-list" class="space-y-3"></div>
        </div>

        <!-- MEMBERS TAB -->
        <div id="tab-members" class="tab-content hidden">
            <h2 class="text-xl font-bold text-white mb-6">Community Members</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="border-b border-white/10 text-gray-500 uppercase text-xs">
                        <th class="text-left p-3">Name</th><th class="text-left p-3">Email</th><th class="text-left p-3">Branch</th><th class="text-left p-3">Year</th><th class="text-left p-3">Joined</th>
                    </tr></thead>
                    <tbody id="members-list"></tbody>
                </table>
            </div>
        </div>

        <!-- MESSAGES TAB -->
        <div id="tab-messages" class="tab-content hidden">
            <h2 class="text-xl font-bold text-white mb-6">Contact Messages</h2>
            <div id="messages-list" class="space-y-3"></div>
        </div>

        <!-- REGISTRATIONS TAB -->
        <div id="tab-registrations" class="tab-content hidden">
            <h2 class="text-xl font-bold text-white mb-6">Event Registrations</h2>
            <div class="overflow-x-auto">
                <table class="w-full text-sm">
                    <thead><tr class="border-b border-white/10 text-gray-500 uppercase text-xs">
                        <th class="text-left p-3">Student</th><th class="text-left p-3">Email</th><th class="text-left p-3">Department</th><th class="text-left p-3">Date</th>
                    </tr></thead>
                    <tbody id="registrations-list"></tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="admin.js"></script>
</body>
</html>
