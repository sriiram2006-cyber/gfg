<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GfG RIT Admin - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: { extend: { colors: { gfg: { DEFAULT: '#2F8D46', light: '#4ade80', dark: '#166534' }, dark: { DEFAULT: '#0f172a', card: '#1e293b' } }, fontFamily: { sans: ['Outfit', 'sans-serif'] } } }
        }
    </script>
    <link rel="stylesheet" href="admin.css">
</head>
<body class="antialiased min-h-screen flex items-center justify-center bg-[#0a0f1a]">

    <div class="w-full max-w-md mx-4">
        <!-- Logo -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center gap-3 mb-4">
                <img src="https://media.geeksforgeeks.org/gfg-gg-logo.svg" alt="GfG Logo" class="w-12 h-12 rounded">
                <span class="font-bold text-2xl text-white">GeeksforGeeks <span class="text-gfg">RIT</span></span>
            </div>
            <p class="text-gray-500 text-sm font-medium uppercase tracking-widest">Admin Portal</p>
        </div>

        <!-- Login Card -->
        <div class="bg-[#111827] border border-white/5 rounded-2xl p-8 shadow-[0_0_60px_rgba(47,141,70,0.08)]">
            <h2 class="text-xl font-bold text-white mb-1">Welcome back</h2>
            <p class="text-gray-500 text-sm mb-8">Sign in to manage your campus club</p>

            <form id="login-form" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Username</label>
                    <div class="relative">
                        <i class="fa-solid fa-user absolute left-4 top-1/2 -translate-y-1/2 text-gray-600"></i>
                        <input type="text" id="login-username" required autocomplete="username"
                            class="w-full bg-[#0a0f1a] border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-gfg focus:ring-1 focus:ring-gfg placeholder-gray-600 text-sm"
                            placeholder="Enter username">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-400 mb-2">Password</label>
                    <div class="relative">
                        <i class="fa-solid fa-lock absolute left-4 top-1/2 -translate-y-1/2 text-gray-600"></i>
                        <input type="password" id="login-password" required autocomplete="current-password"
                            class="w-full bg-[#0a0f1a] border border-white/10 rounded-xl pl-11 pr-4 py-3 text-white focus:outline-none focus:border-gfg focus:ring-1 focus:ring-gfg placeholder-gray-600 text-sm"
                            placeholder="Enter password">
                    </div>
                </div>
                <div id="login-error" class="hidden text-red-400 text-sm text-center bg-red-500/10 p-3 rounded-lg"></div>
                <button type="submit" id="login-btn"
                    class="w-full bg-gradient-to-r from-gfg to-gfg-light hover:from-gfg-dark hover:to-gfg text-white font-bold py-3.5 rounded-xl shadow-[0_0_20px_rgba(47,141,70,0.25)] transition-all flex justify-center items-center gap-2 text-sm">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>
        </div>

        <p class="text-center text-gray-600 text-xs mt-6">
            <a href="http://127.0.0.1:3000/index.html" class="hover:text-gfg transition-colors">← Back to Website</a>
        </p>
    </div>

    <script src="admin.js"></script>
</body>
</html>
